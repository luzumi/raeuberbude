version: '3.8'
services:
  test-db:
    image: postgres:16-alpine
    container_name: raeuberbude-test-db
    environment:
      POSTGRES_DB: raeuberbude_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data

volumes:
  test-db-data:

