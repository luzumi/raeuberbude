services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-rb_root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-rb_secret}"
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE:-raueberbude}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "27018:27017"

  api:
    build:
      context: ./nest-app
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NEST_PORT: "${API_PORT:-3001}"
      CORS_ORIGINS: "${CORS_ORIGINS:-https://localhost}"
      # API spricht innerhalb des Compose-Netzwerks den Service-Namen 'mongo' an
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-rb_root}:${MONGO_INITDB_ROOT_PASSWORD:-rb_secret}@mongo:27017/${MONGO_INITDB_DATABASE:-raueberbude}?authSource=admin"
      # LLM Configuration
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-claude-sonnet-4-6}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-500}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.3}"
      # STT Configuration
      STT_ENABLED: "true"
      STT_PRIMARY: "vosk"
      STT_SECONDARY: "whisper"
      STT_LANG: "de-DE"
      STT_MAX_DURATION_MS: "30000"
      VOSK_WS_URL: "ws://vosk:2700"
      WHISPER_URL: "http://whisper:9000/transcribe"
      # LLM Configuration
      LLM_URLS: "${LLM_URLS:-http://host.docker.internal:1234/v1/chat/completions}"
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$NEST_PORT/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  logs:
    image: node:20
    working_dir: /app
    volumes:
      - ../server:/app
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-rb_root}:${MONGO_INITDB_ROOT_PASSWORD:-rb_secret}@mongo:27017/${MONGO_INITDB_DATABASE:-raueberbude}?authSource=admin"
      PORT: "3000"
      # LLM Configuration
      LLM_URL: "${LLM_URL:-http://host.docker.internal:1234/v1/chat/completions}"
      LLM_MODEL: "${LLM_MODEL:-mistralai/mistral-7b-instruct-v0.3}"
      LLM_FALLBACK_MODEL: "${LLM_FALLBACK_MODEL:-}"
      LLM_USE_GPU: "${LLM_USE_GPU:-true}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS:-30000}"
      LLM_TARGET_LATENCY_MS: "${LLM_TARGET_LATENCY_MS:-2000}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-500}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.3}"
      LLM_CONFIDENCE_SHORTCUT: "${LLM_CONFIDENCE_SHORTCUT:-0.85}"
      LLM_HEURISTIC_BYPASS: "${LLM_HEURISTIC_BYPASS:-false}"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["sh","-lc","npm init -y >/dev/null 2>&1 || true && npm i express mongoose ws dotenv --omit=dev && node index.js"]
    ports:
      - "${LOGS_PORT:-3003}:3000"

  # Vosk Speech-to-Text Server (Offline, German - small model mounted from host)
  vosk:
    image: alphacep/kaldi-vosk-server:latest
    restart: unless-stopped
    volumes:
      - ./vosk-model:/opt/vosk-model
    command: ["python3", "/opt/vosk-server/websocket/asr_server.py", "/opt/vosk-model/model"]
    ports:
      - "${VOSK_PORT:-2700}:2700"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys;s=socket.socket();s.settimeout(1);s.connect(('localhost',2700));sys.exit(0)\" || exit 1"]

  # Whisper Speech-to-Text Server (High Quality, Local)
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_MODEL: "${WHISPER_MODEL:-small}"
      ASR_ENGINE: "faster_whisper"
      ASR_MODEL_PATH: /data/whisper
      ASR_DOWNLOAD_MODEL: "true"
      ASR_VAD_MODE: 0
      ASR_LANGUAGE: "${WHISPER_LANGUAGE:-de}"
    volumes:
      - whisper_models:/data/whisper
    ports:
      - "${WHISPER_PORT:-9090}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Port 80 nur intern – Nginx terminiert SSL und proxied hierher.
    # Kein direkter Host-Port nötig.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api

volumes:
  mongo_data:
  whisper_models:
  vosk_models:
