name: Backend Integration Tests

on:
  push:
    branches: [ main, develop, 'feature/LUD28-*' ]
    paths:
      - 'backend/nest-app/**'
      - '.github/workflows/backend-integration-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/nest-app/**'

jobs:
  integration-tests:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest

    # Service container für PostgreSQL
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: raeuberbude_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/nest-app

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/nest-app/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Verify PostgreSQL Connection
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -p 5433 -U test -d raeuberbude_test -c "SELECT version();"

      - name: 🔄 Run Database Migrations
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_DATABASE: raeuberbude_test
        run: npm run migration:run

      - name: 🧪 Run Integration Tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_DATABASE: raeuberbude_test
        run: npm run test:integration -- --coverage

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/nest-app/coverage/lcov.info
          flags: integration
          name: backend-integration
          fail_ci_if_error: false

      - name: 📈 Generate Test Report
        if: always()
        run: |
          echo "## 🧪 Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed. See artifacts for details." >> $GITHUB_STEP_SUMMARY

      - name: 🗄️ Dump Database Schema (on failure)
        if: failure()
        env:
          PGPASSWORD: test
        run: |
          pg_dump -h localhost -p 5433 -U test -d raeuberbude_test --schema-only > schema-dump.sql

      - name: 📤 Upload Schema Dump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-dump
          path: backend/nest-app/schema-dump.sql
          retention-days: 7

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/nest-app/coverage/
          retention-days: 14

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: integration-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: raeuberbude_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/nest-app

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/nest-app/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔄 Run Database Migrations
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_DATABASE: raeuberbude_test
        run: npm run migration:run

      - name: 🔍 Validate Database Schema
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -p 5433 -U test -d raeuberbude_test -f scripts/validate-schema.sql

