<!--
  Neon retro-podcast microphone SVG.
  The scan-line rect is clipped to the capsule body and only animated
  when the host carries the .recording class.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 40 56"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

  <defs>
    <!-- Clip region: matches the capsule outline so the scan-line
         stays inside the microphone body. -->
    <clipPath id="mic-capsule-clip">
      <rect x="11" y="5" width="18" height="26" rx="9" ry="9"/>
    </clipPath>
  </defs>

  <!-- Capsule body (pill shape) -->
  <rect class="mic-outline"
        x="11" y="5" width="18" height="26" rx="9" ry="9"/>

  <!-- Capsule grill lines (left-side detail) -->
  <line class="mic-outline" x1="14" y1="15" x2="17" y2="15"/>
  <line class="mic-outline" x1="14" y1="21" x2="17" y2="21"/>

  <!-- U-shaped holder -->
  <path class="mic-outline"
        d="M 8,20 L 8,26 Q 8,35 20,35 Q 32,35 32,26 L 32,20"/>

  <!-- Stand stem -->
  <line class="mic-outline" x1="20" y1="35" x2="20" y2="46"/>

  <!-- Stand base -->
  <line class="mic-outline" x1="12" y1="46" x2="28" y2="46"/>

  <!-- Scan line – only visible during recording -->
  <rect class="scan-line"
        x="11" y="5" width="18" height="3" rx="1"
        clip-path="url(#mic-capsule-clip)"/>
</svg>
